<!DOCTYPE html>
<html lang="english">
    <head>
        <title>Tessera</title>
        <meta property="og:title" content="Tessera" />
        <meta property="twitter:card" content="summary_large_image" />

        
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta charset="UTF-8" />
        <link rel="stylesheet" href="./globalstyles.css"/>
    </head>
    <body>
        
        <link rel="stylesheet" href="./Pages/Landing Page/style.css"/>
        <div class="container-fit-to-screen color-bg">
            


            <!-- background -->
            <div class="login-mask bg-image">
                <img src="./images/login.jpg" alt="its just clouds">
            </div>

            <!-- logo -->
            <div class="container-logo login-container-logo textstyle-standard">
                <img class="parent-height-ratio-1-1" src="./images/Freepik ticket.png" alt="Freepik Logo">
                Tessera
            </div>

            <!-- already logged in -->
            <div id="loggedin" class="container-secondaryfill login-container default-shadow">
                <button id="gotohomepage" class="button-style1 login-input default-shadow">You are already logged in! ( go to next page )</button>
            </div>

            <!-- to log in -->
            <div id="notloggedin" class="container-secondaryfill login-container default-shadow">
                <form id="loginForm">
                    <input id="email" class="button-style1 login-input default-shadow" type="email" name="email" placeholder="Enter Email" />
                    <input id="password" style="top: 120px;" class="button-style1 login-input default-shadow" type="password" name="password" placeholder="Enter Password" />

                    <button class="button-style1 login-submit default-shadow" type="submit">Login</button>
                </form>

                <!-- registration -->
                <div class="login-registration textstyle-standard">
                    <a href="./Pages/Registration/Registration.html">New to Tessera? ( Register)</a>
                </div>

                <!-- external log in -->
                <button id="googlelogin" class="button-style1 login-externalloginbutton textstyle-standard">
                    <img src="./images/icons8-google-48.png" alt="google logo">
                </button>
            </div>


        </div>

        
        <link rel="canonical" href="https://pil0wl.github.io/Tessera/">
    </body>

    <script src="./globalscript.js"></script>
    <script src="./Pages/Landing Page/script.js"></script>
    <script type="module" src="./local_modules/aws main.js"></script>
    <script type="module" src="./Pages/Landing Page/module.js"></script>
</html>
