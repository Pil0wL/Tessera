<!DOCTYPE html>
<html lang="en">
<head>
    <title>Tessera - Admin Panel</title>
    <head>
        <title>Tessera</title>
        <meta property="og:title" content="Tessera" />
        <meta property="twitter:card" content="summary_large_image" />
        
        
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta charset="UTF-8" />
        <link rel="stylesheet" href="../.././globalstyles.css"/>
    </head>
</head>
    <body>
        <link rel="stylesheet" href="./style.css"/>
        <link rel="stylesheet" href="./style_pendingtickets.css"/>
        
        <div class="container-fit-to-screen color-bg">
            <!-- top bar -->
            <div id="topbar" class="container-secondaryfillbordered admin-firstbar">
                Yeah I AM THIRSTY
                <!-- text is replaced -->
            </div>
            <!-- main content -->
            <div class="admin-primary-container">
                <!-- buttons-->
                <div class="admin-container-buttons">
                    <button id="OverviewButton" class="container-secondaryfill admin-category-button">Overview</button>
                    <button id="PendingTicketsButton" class="container-secondaryfill admin-category-button">Pending Tickets</button>
                    <button id="UserMaButton" class="container-secondaryfill admin-category-button">User Management</button>
                    <button id="SystemRecButton" class="container-secondaryfill admin-category-button">System Records</button>
                    <button id="ReportsButton" class="container-secondaryfill admin-category-button">Reports</button>
                    <button id="SettingsButton" class="container-secondaryfill admin-category-button">Settings</button>
                    

                </div>

                <!-- panels -->
                <div class="container-secondaryfill admin-main-container-category">
                    <!-- Overview -->
                    <div id="OverviewPanel" class="container-mainfill admin-container-individual-categorypanel">
                        overview

                    </div>
                    <!-- Pending Tickets -->
                    <div id="PendingTicketsPanel" class="admin-container-individual-categorypanel">

                        <!-- filter 1 -->
                        <div id="pending-tickets-user-filter" class="button-style2 default-shadow container-dropdown">
                            <img class="parent-height-ratio-1-1" src="../.././images/Freepik down.png" alt="Freepik Logo">
                    
                            <p>Sort By: This Text is replaced</p>
                            <div class="default-shadow container-dropdown-content">
                                <button>Submitted Descending</button>
                                <button>Submitted Ascending</button>
                                <button>Date Created Descending</button>
                                <button>Date Created Ascending</button>
                            </div>
                        </div>

                        <!-- User list -->
                        <div class="button-style1 admin-component-pendingtickets a">

                            <div class="container-headertextstyle a">
                                User Results
                            </div>
                            <div class="container-headertextstyle b"></div>
                            <div class="container-headertextstyle c">
                                <ol id="pending-tickets-user-list" class="container-fit-to-container"></ol>
                            </div>
                        </div>

                        <div class="admin-component-pendingtickets border"></div>

                        <!-- Searcch for their active ticket list -->
                        <div id="pending-tickets-active-search" class="button-style1 default-shadow search-box admin-component-pendingtickets-placement a">
                            <button>
                                <img class="parent-height-ratio-1-1" src="../.././images/Freepik magnifying.png" alt="Freepik Logo">
                            </button>
                            <input type="text" placeholder="Search...">
                        </div>

                        <!-- filter 1 -->
                        <div id="pending-tickets-active-filter1" class="button-style2 default-shadow container-dropdown admin-component-pendingtickets-placement b">
                            <img class="parent-height-ratio-1-1" src="../.././images/Freepik down.png" alt="Freepik Logo">
                    
                            <p>Sort By: This Text is replaced</p>
                            <div class="default-shadow container-dropdown-content">
                                <button>Date Ascending</button>
                                <button>Date Descending</button>
                                <button>Alphabetically Ascending</button>
                                <button>Alphabetically Descending</button>
                            </div>
                        </div>

                        <!-- Their Active Ticket List -->
                        <div class="button-style1 admin-component-pendingtickets b">

                            <div class="container-headertextstyle a">
                                Active Tickets
                            </div>
                            <div class="container-headertextstyle b"></div>
                            <div class="container-headertextstyle c">
                                <ol id="pending-tickets-active-tickets" class="container-fit-to-container"></ol>
                            </div>
                        </div>

                        <!-- Description -->
                        <div class="button-style1 admin-component-pendingtickets b c">

                            <div class="container-headertextstyle a">
                               Description
                            </div>
                            <div class="container-headertextstyle b"></div>
                            <div id="pending-tickets-description" class="container-headertextstyle c">
                                Click on a ticket!
                            </div>
                        </div>

                        <!-- Actions -->
                        <div class="button-style1 admin-component-pendingtickets b d">

                            <div class="container-headertextstyle a">
                               Actions
                            </div>
                            <div class="container-headertextstyle b"></div>
                            <div class="container-headertextstyle c">
                                <ol class="container-fit-to-container">
                                    <li class="button-style2 admin-list-button"><button id="pending-tickets-note">Note</button></li>
                                    <li class="button-style2 admin-list-button"><button id="pending-tickets-set-status">Set Status</button></li>
                                    <li class="button-style2 admin-list-button"><button id="pending-tickets-archive">Archive</button></li>
                                </ol>
                            </div>
                        </div>
                    </div>

                    <!-- User Management -->
                    <div id="UserMaPanel" class="container-mainfill admin-container-individual-categorypanel">
                        user management

                    </div>
                    <!-- System Records -->
                    <div id="SystemRecPanel" class="container-mainfill admin-container-individual-categorypanel">
                        user management

                    </div>

                    <!-- Reports -->
                    <div id="ReportsPanel" class="container-mainfill admin-container-individual-categorypanel">
                        reports

                    </div>
                    <!-- Settings -->
                    <div id="SettingsPanel" class="container-mainfill admin-container-individual-categorypanel">
                        settings

                    </div>

                </div>


            </div>
        </div>

        <link rel="canonical" href="https://pil0wl.github.io/Tessera/">

    </body>
    <script src="../.././globalscript.js"></script>
    <script src="./script.js"></script>
    <script type="module" src="./module.js"></script>
</html>
